<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Board Direction · Triodian</title>
<link rel="icon" href="/triodian-mark.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/source-serif-4-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
<style>.hdr{border-top-color:var(--aubergine)}.hdr .dot{background:var(--aubergine)}.btn.primary{background:var(--aubergine);border-color:var(--aubergine)}.steplist{display:grid;gap:10px}.steplist .panel2{padding:12px 16px}.stepid{font-family:var(--mono);color:var(--aubergine);margin-right:8px}</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="hidden" aria-live="polite"></div>
<script src="/bd-content.js"></script>
<script src="/bd-example.js"></script>
<script src="/suite.js" data-current="bd"></script>
<script type="module">
  import { merge3 } from "/shared/merge.js";
  import * as rules from "/shared/rules.js";
  window.BDMerge = { merge3 }; window.BDRules = rules;
  window.dispatchEvent(new Event('bd:rules'));
</script>
<script>
  // The shared rules load as a module (deferred), so the app boots once they are in.
  (function () { function start() { const s = document.createElement('script'); s.src = '/bd.js'; document.body.appendChild(s); }
    if (window.BDRules) start(); else window.addEventListener('bd:rules', start, { once: true }); })();
</script>
</body>
</html>
